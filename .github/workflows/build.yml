name: build

# Guards the NBP_BLE master gate (main/Kconfig.projbuild) from bit-rotting
# and publishes pre-built firmware images for the browser flasher.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'web-flasher/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths-ignore:
      - 'web-flasher/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3, esp32c3, esp32c6]
        variant:
          - name: ble-on          # default: NimBLE scanner/proxy + dashboard
            defaults: sdkconfig.defaults
          - name: ble-off         # NBP_BLE=n: WiFi/NAT/dashboard only, no NimBLE
            defaults: sdkconfig.defaults;.github/build-no-ble.defaults
    name: build (${{ matrix.target }}, ${{ matrix.variant.name }})
    steps:
      - uses: actions/checkout@v4

      # wifi_creds.h is gitignored (real secrets) and the build #errors
      # without it unless NBP_AP_FALLBACK is on. Seed the placeholder so CI
      # exercises the default fixed-credential STA path.
      - name: Seed placeholder WiFi credentials
        run: cp include/wifi_creds.h.example include/wifi_creds.h

      # nanopb runtime + generator is gitignored (cloned per-host, see
      # components/api_proto/generate.sh). CMake FATAL_ERRORs without it.
      # Clone on the runner; the workspace is mounted into the build container.
      - name: Vendor nanopb
        run: git clone --depth 1 https://github.com/nanopb/nanopb.git components/api_proto/nanopb

      - name: Build (${{ matrix.target }}, ${{ matrix.variant.name }})
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.3
          target: ${{ matrix.target }}
          # nanopb_generator.py (run by CMake) needs protobuf + a protoc;
          # install both inside the IDF container before building.
          # NBP_VARIANT is the identity the dashboard update check matches
          # against release assets (GET /appinfo "variant"); the root
          # CMakeLists.txt refuses it unless this is the stock config.
          # The action runs `command` inside bash -c '...': it must contain
          # no single quote (an apostrophe in a comment ran the rest on the
          # runner, "idf.py: command not found").
          command: |
            set -e
            pip install protobuf grpcio-tools
            name="${{ matrix.target }}-${{ matrix.variant.name }}"
            idf.py -DSDKCONFIG_DEFAULTS="${{ matrix.variant.defaults }}" -DNBP_VARIANT="$name" build
            mkdir -p "dist/$name"
            cp build/nimble_ble_proxy.bin "dist/$name/nimble_ble_proxy-$name-ota.bin"
            cp build/bootloader/bootloader.bin "dist/$name/bootloader-$name.bin"
            cp build/partition_table/partition-table.bin "dist/$name/partition-table-$name.bin"
            cp build/ota_data_initial.bin "dist/$name/ota_data_initial-$name.bin"
            cp build/flash_args "dist/$name/flash_args-$name"
            cd build
            python -m esptool --chip "${{ matrix.target }}" merge-bin -o "../dist/$name/nimble_ble_proxy-$name-flash.bin" @flash_args

      - name: Upload firmware binaries (${{ matrix.target }}, ${{ matrix.variant.name }})
        uses: actions/upload-artifact@v4
        with:
          name: nimble_ble_proxy-${{ matrix.target }}-${{ matrix.variant.name }}-${{ github.sha }}
          path: dist/${{ matrix.target }}-${{ matrix.variant.name }}/

  # One job creates the release, as a DRAFT, once every build is done. The CI
  # images are unsigned, and S3/C3/C6 firmware that installs an unsigned image
  # trusts no key and refuses every later OTA until a USB flash. A draft is not
  # public; scripts/release_sign.py --upload replaces the S3/C3/C6 images with
  # signed ones, publishes the draft and dispatches pages.yml.
  release:
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft release with the unsigned CI assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          mapfile -t files < <(find artifacts -type f \( -name 'nimble_ble_proxy-*-ota.bin' \
            -o -name 'nimble_ble_proxy-*-flash.bin' -o -name 'bootloader-*.bin' \
            -o -name 'partition-table-*.bin' -o -name 'ota_data_initial-*.bin' \
            -o -name 'flash_args-*' \) | sort)
          printf '%s\n' "${files[@]}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A re-run must never put unsigned images on a published release.
            if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" != true ]; then
              echo "::error::release $tag is already published; not uploading unsigned CI images to it"
              exit 1
            fi
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "$tag" --notes "Draft: unsigned CI images. Sign with scripts/release_sign.py sign $tag --upload." \
              "${files[@]}"
          fi
