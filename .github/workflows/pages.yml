name: pages

on:
  push:
    branches: [main]
    paths:
      - web-flasher/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage latest release firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [ -n "$tag" ]; then
            mkdir -p "web-flasher/firmware/$tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*-flash.bin' --dir "web-flasher/firmware/$tag" --clobber
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-flasher
      - id: deployment
        uses: actions/deploy-pages@v4
